# Builds the Firbo-branded OmniRoute image on GitHub's runners (the small VPS cannot build it) and publishes it
# to ghcr.io/<owner>/omniroute:firbo. The server then only pulls it: OMNIROUTE_IMAGE=ghcr.io/<owner>/omniroute:firbo
name: Firbo image
on:
  push:
    branches: [firbo/branding]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: firbo-image
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runner-web
          push: true
          build-args: |
            OMNIROUTE_BUILD_MEMORY_MB=12288
          tags: ghcr.io/${{ github.repository_owner }}/omniroute:firbo
          cache-from: type=gha
          cache-to: type=gha,mode=max
